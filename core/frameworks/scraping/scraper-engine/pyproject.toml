[tool.coverage.run]
branch = true
source = [ "scraper_engine" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../../coverage/./core/frameworks/scraping/scraper-engine/html'
 --cov-report xml:'../../../../coverage/./core/frameworks/scraping/scraper-engine/coverage.xml'
 --html='../../../../reports/./core/frameworks/scraping/scraper-engine/unittests/html/index.html'
 --junitxml='../../../../reports/./core/frameworks/scraping/scraper-engine/unittests/junit.xml'
"""

[tool.poetry]
name = "frameworks-scraping-scraper-engine"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "scraper_engine"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"
  scrapy = "^2.13.0"
  pydantic = "^2.11.4"
  pydantic-settings = "^2.9.1"
  twisted = "^24.11.0"

    [tool.poetry.dependencies.python-common-logger]
    path = "../../../../libs/python/common/logger"
    develop = true

    [tool.poetry.dependencies.python-common-cliargs]
    path = "../../../../libs/python/common/cliargs"
    develop = true

    [tool.poetry.dependencies.python-capture-crawler-cliargs]
    path = "../../../../libs/python/capture/crawler-cliargs"
    develop = true

    [tool.poetry.dependencies.python-common-rmq-queue]
    path = "../../../../libs/python/common/rmq-queue"
    develop = true

    [tool.poetry.dependencies.python-common-pydebug]
    path = "../../../../libs/python/common/pydebug"
    develop = true

    [tool.poetry.dependencies.python-common-stats-collector]
    path = "../../../../libs/python/common/stats-collector"
    develop = true

    [tool.poetry.dependencies.python-common-pyoutput]
    path = "../../../../libs/python/common/pyoutput"
    develop = true

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
