[tool.coverage.run]
branch = true
source = [ "pydebug" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-fail-under=80
 --cov-report html:'../../../../coverage/libs/python/common/pydebug/html'
 --cov-report xml:'../../../../coverage/libs/python/common/pydebug/coverage.xml'
 --html='../../../../reports/libs/python/common/pydebug/unittests/html/index.html'
 --junitxml='../../../../reports/libs/python/common/pydebug/unittests/junit.xml'
"""

[tool.poetry]
name = "python-common-pydebug"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "pydebug"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
