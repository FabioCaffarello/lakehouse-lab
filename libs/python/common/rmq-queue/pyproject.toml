[tool.coverage.run]
branch = true
source = [ "rmq_queue" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-fail-under=80
 --cov-report html:'../../../../coverage/libs/python/common/rmq-queue/html'
 --cov-report xml:'../../../../coverage/libs/python/common/rmq-queue/coverage.xml'
 --html='../../../../reports/libs/python/common/rmq-queue/unittests/html/index.html'
 --junitxml='../../../../reports/libs/python/common/rmq-queue/unittests/junit.xml'
"""

[tool.poetry]
name = "python-common-rmq-queue"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "rmq_queue"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"
  pika = "^1.3.2"

    [tool.poetry.dependencies.python-common-pysd]
    path = "../pysd"
    develop = true

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
