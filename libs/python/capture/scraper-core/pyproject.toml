[tool.coverage.run]
branch = true
source = [ "scraper_core" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-fail-under=80
 --cov-report html:'../../../../coverage/libs/python/capture/scraper-core/html'
 --cov-report xml:'../../../../coverage/libs/python/capture/scraper-core/coverage.xml'
 --html='../../../../reports/libs/python/capture/scraper-core/unittests/html/index.html'
 --junitxml='../../../../reports/libs/python/capture/scraper-core/unittests/junit.xml'
"""

[tool.poetry]
name = "python-capture-scraper-core"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "scraper_core"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"
  scrapy = "^2.13.0"

    [tool.poetry.dependencies.python-common-logger]
    path = "../../common/logger"
    develop = true

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
