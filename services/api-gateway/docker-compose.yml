services:
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-gateway-network
  api-gateway:
    image: fabiocaffarello/api-gateway:latest
    container_name: api-gateway
    ports:
      - 8000:80
    depends_on:
      - mongo
    environment:
      - MONGODB_USER=user
      - MONGODB_PASS=password
      - MONGO_PORT_27017_TCP_ADDR=mongodb://mongo:27017
    # volumes:
    #   - ./hack:/app/services/api-gateway/hack
    networks:
      - api-gateway-network
networks:
  api-gateway-network:
    name: api-gateway-network
    driver: bridge
