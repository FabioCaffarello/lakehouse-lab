[tool.coverage.run]
branch = true
source = [ "bot" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../../coverage/./services/capture/bots/example-bot/html'
 --cov-report xml:'../../../../coverage/./services/capture/bots/example-bot/coverage.xml'
 --html='../../../../reports/./services/capture/bots/example-bot/unittests/html/index.html'
 --junitxml='../../../../reports/./services/capture/bots/example-bot/unittests/junit.xml'
"""

[tool.poetry]
name = "services-capture-bots-example-bot"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "bot"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"

    [tool.poetry.dependencies.python-capture-scraper-core]
    path = "../../../../libs/python/capture/scraper-core"
    develop = true

    [tool.poetry.dependencies.python-common-pystatus]
    path = "../../../../libs/python/common/pystatus"
    develop = true

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
