[tool.coverage.run]
branch = true
source = [ "navigator_engine" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/./services/capture/navigator-engine/html'
 --cov-report xml:'../../../coverage/./services/capture/navigator-engine/coverage.xml'
 --html='../../../reports/./services/capture/navigator-engine/unittests/html/index.html'
 --junitxml='../../../reports/./services/capture/navigator-engine/unittests/junit.xml'
"""

[tool.poetry]
name = "services-capture-navigator-engine"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "navigator_engine"

  [tool.poetry.dependencies]
  python = ">=3.9,<4"

    [tool.poetry.dependencies.python-common-logger]
    path = "../../../libs/python/common/logger"
    develop = true

    [tool.poetry.dependencies.python-common-cliargs]
    path = "../../../libs/python/common/cliargs"
    develop = true

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
