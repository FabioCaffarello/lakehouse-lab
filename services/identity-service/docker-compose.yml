services:
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-service-network
  identity-service:
    image: fabiocaffarello/identity-service:latest
    container_name: identity-service
    ports:
      - 8000:80
    depends_on:
      - mongo
    environment:
      - MONGODB_USER=user
      - MONGODB_PASS=password
      - MONGO_PORT_27017_TCP_ADDR=mongodb://mongo:27017
    networks:
      - identity-service-network
networks:
  identity-service-network:
    name: identity-service-network
    driver: bridge
